const tip = $("#tip");

  tip.style.left = x + "px"; tip.style.top = (e.clientY + 12) + "px";

function escala(max) {
  if (max <= 0) return { max: 1, pasos: [0, 1] };
  const bruto = max / 4, mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= bruto);
  const top = Math.ceil(max / paso) * paso, pasos = [];
  for (let v = 0; v <= top + 1e-9; v += paso) pasos.push(v);
  return { max: top, pasos };
}
// Columnas verticales (1 o 2 series). items: [{etq, vals:[...], tips:[...]}]
function columnas(items, opt) {
  const W = 640, H = 230, L = 58, B = 40, T = 10, ns = items[0] ? items[0].vals.length : 1;
  const max = Math.max(0, ...items.flatMap((i) => i.vals.map((v) => v || 0)));
  const e = escala(max), iw = W - L - 6, ih = H - T - B, bw = iw / Math.max(items.length, 1);
  const gap = 2, colW = Math.max(2, Math.min(28, (bw - 6) / ns - gap));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.titulo)}">`;
  for (const p of e.pasos) {
    const y = T + ih - (p / e.max) * ih;
    s += `<line x1="${L}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
    s += `<text x="${L - 6}" y="${y + 4}" text-anchor="end">${esc(opt.fmtEje(p))}</text>`;
  }
  const cada = Math.ceil(items.length / 12);
  items.forEach((it, i) => {
    const x0 = L + i * bw + (bw - ns * (colW + gap)) / 2;
    it.vals.forEach((v, j) => {
      const h = Math.max(0, ((v || 0) / e.max) * ih), x = x0 + j * (colW + gap), y = T + ih - h;
      const r = Math.min(4, colW / 2, h);
      s += `<path d="M${x},${T + ih} V${y + r} Q${x},${y} ${x + r},${y} H${x + colW - r} Q${x + colW},${y} ${x + colW},${y + r} V${T + ih} Z" fill="var(--series-${j + 1})" data-tip="${esc(it.tips[j])}"/>`;
    });
    s += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(it.tips.join("\n"))}"/>`;
    if (i % cada === 0) s += `<text x="${L + i * bw + bw / 2}" y="${H - B + 14}" text-anchor="end" transform="rotate(-40 ${L + i * bw + bw / 2} ${H - B + 14})">${esc(it.etq)}</text>`;
  });
  s += `<line x1="${L}" x2="${W - 6}" y1="${T + ih}" y2="${T + ih}" stroke="var(--text-muted)"/>`;
  return s + "</svg>";
}
// Barras horizontales. items: [{etq, val, tip}], opt.ref = línea de referencia (por ejemplo 1 = 100 %)
function barras(items, opt) {
  const W = 640, fila = 24, L = 150, R = 70, T = 6, H = T + items.length * fila + 22;
  const max = Math.max(opt.ref || 0, ...items.map((i) => i.val || 0));
  const e = escala(max), iw = W - L - R;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.titulo)}">`;
  for (const p of e.pasos) {
    const x = L + (p / e.max) * iw;
    s += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - 20}" stroke="var(--grid)"/>`;
    s += `<text x="${x}" y="${H - 6}" text-anchor="middle">${esc(opt.fmtEje(p))}</text>`;
  }
  items.forEach((it, i) => {
    const y = T + i * fila + 4, w = Math.max(0, ((it.val || 0) / e.max) * iw), h = fila - 9, r = Math.min(4, h / 2, w);
    s += `<text x="${L - 8}" y="${y + h - 3}" text-anchor="end">${esc(it.etq)}</text>`;
    s += `<path d="M${L},${y} H${L + w - r} Q${L + w},${y} ${L + w},${y + r} V${y + h - r} Q${L + w},${y + h} ${L + w - r},${y + h} H${L} Z" fill="var(--series-1)" data-tip="${esc(it.tip)}"/>`;
    s += `<text x="${L + w + 6}" y="${y + h - 3}">${esc(it.lab != null ? it.lab : opt.fmtVal(it.val))}</text>`;

// Línea (una serie) con puntos y tooltip
function linea(items, opt) {

  }

function pDefs() {
  return panel("Definiciones de los indicadores", "Contrato aprobado por el grupo en R5 (04_KPI/catalogo_kpi.md). Esta página no inventa indicadores nuevos.",
    `<dl class="defs">${DEFS.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>`) +
    panel("Qué no se puede calcular con estos datos", null,
    `<p>Utilidad neta, rotación de inventario valorizada y margen después de comisiones: el caso no trae esos datos. El recaudo por vendedor o categoría tampoco, porque el archivo de recaudos no los incluye.</p>`);
}
const NOMBRES = { K01: "K01 Ventas netas", K02: "K02 Unidades netas", K03: "K03 Descuento %", K04: "K04 Devolución %", K05: "K05 Margen bruto", K06: "K06 Margen %",
  K07: "K07 Meta", K08: "K08 Cumplimiento %", K09: "K09 Meses con meta cumplida %", K10: "K10 Existencias", K11: "K11 Agotados", K12: "K12 Recaudo",
  K13: "K13 Saldo de cartera", K14: "K14 Cartera vencida %", K15: "K15 Facturación con IVA" };
const PORC = ["K03", "K04", "K06", "K08", "K09", "K14"], DINERO = ["K01", "K05", "K07", "K12", "K13", "K15"];
const comoSQL = (c, v) => v == null ? null : PORC.includes(c) ? Math.round(v * 10000) / 100 : DINERO.includes(c) ? Math.round(v) / 100 : v;
const verSQL = (c, v) => v == null ? "—" : PORC.includes(c) ? nf2.format(v) : DINERO.includes(c) ? nf2.format(v) : nf0.format(v);
function pValida() {
  const A = calcular({ mes: null, suc: null, ven: null, cat: null }), B = calcular({ mes: 202609, suc: 2, ven: null, cat: null });
  let ok = 0;
  const filas = Object.keys(NOMBRES).map((c) => {
    const a = comoSQL(c, A[c]), b = comoSQL(c, B[c]), sa = D.referencia.A[c], sb = D.referencia.B[c];
    const bien = a === sa && b === sb; if (bien) ok++;
    return [esc(NOMBRES[c]), verSQL(c, a), verSQL(c, sa), verSQL(c, b), verSQL(c, sb), bien ? '<span class="ok">✓ igual</span>' : '<span class="mal">✗ distinto</span>'];
  });
  let h = panel("Comparación con SQL", `Escenario A = todo. Escenario B = Sucursal Pereira y septiembre de 2026. Los valores SQL vienen de 04_KPI/kpi_referencia.sql. Porcentajes × 100. Resultado: ${ok} de 15 iguales.`,
    tabla(["Indicador", "A: página", "A: SQL", "B: página", "B: SQL", ""], filas));
  const c = D.control;
  h += panel("Control de los archivos embebidos", "Filas y totales de cada archivo, contra lo que dijo validar_exportes.sql en R4.",
    tabla(["Archivo", "Filas", "Esperado", "Total", "Esperado", ""], c.map((x) => [esc(x[0]), nf0.format(x[1]), nf0.format(x[2]), esc(x[3]), esc(x[4]), x[3] === x[4] && x[1] === x[2] ? '<span class="ok">✓</span>' : '<span class="mal">✗</span>'])));
  h += `<p class="nota">Botones para ver el escenario B en las páginas: <button type="button" id="verB">Poner filtros del escenario B</button></p>`;
  return h;
}

function pintar() {
  const f = filtroPagina(), p = $("#contenido");
  p.innerHTML = pagina === "comercial" ? pComercial(f) : pagina === "stock" ? pStock(f) : pagina === "metas" ? pMetas(f) :
    pagina === "recaudo" ? pRecaudo(f) : pagina === "defs" ? pDefs() : pValida();
  const b = $("#verB");
  if (b) b.addEventListener("click", () => { $("#f-mes").value = "202609"; $("#f-suc").value = "2"; $("#f-ven").value = ""; $("#f-cat").value = "";
    F.mes = 202609; F.suc = 2; F.ven = null; F.cat = null; irA("comercial"); });
}
function irA(id) {
  pagina = id;
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === id));
  pintar();
}
$("#tabs").innerHTML = PAGINAS.map((p) => `<button role="tab" data-id="${p.id}">${esc(p.nombre)}</button>`).join("");
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) irA(b.dataset.id); });
$("#sub").textContent = `Corte 30/09/2026 · Datos de ${mesTxt(D.meses[0])} a ${mesTxt(D.meses[D.meses.length - 1])} · Generado ${D.generado} · Funciona sin internet`;
iniciarFiltros();
irA("comercial");
</script>
